plan: |
  Не раскрашивать области, в которых нет лидарных лучей.
  Введены два новых флага (по умолчанию включены):
  - --occlusion-max-depth (occlusion_max_depth), 40 м — предельная глубина;
  - --occlusion-ray-margin (occlusion_ray_margin), 1 ячейка — окрестность.
  Ячейка z-буфера считается «нет лучей», если zmin > предельная глубина
  (включая пустые ячейки zmin = +inf); маска расширяется дилатацией на
  N ячеек; точки, попавшие в расширенную маску, не красятся.
  Паритет с Python-версией больше не поддерживается (Python заморожен и
  перестаёт быть эталоном). Правка общего ядра синхронизируется во всех
  C++-реализациях: colorise/, src/ (ROS) и ColoriseMap/ (кубовый режим).

request: |
  обнови алгоритм раскраски. Не раскрашивай области, в которых нет лидарных
  лучей. То есть буфер глубин показывает глубину больше предельной.
  учти, что надо не раскрашивать точки в какой то окрестности точки с
  предельной глубиной.
  (уточнения: окрестность задаётся в кадре камеры по z-буферу; --max-range
  не трогаем, вводим новый флаг; по умолчанию occlusion_max_depth = 40,
  occlusion_ray_margin = 1; python версию больше не учитывать)

description: >
  Добавлено правило «не раскрашивать области без лидарных лучей»: ячейка z-буфера
  с min-глубиной больше --occlusion-max-depth (пустые ячейки = +inf тоже) считается
  «нет лучей», маска расширяется дилатацией на --occlusion-ray-margin ячеек, точки
  из маски не окрашиваются. Новые ключи/флаги (по умолчанию 40 м и 1 ячейка)
  прокинуты во все три C++-реализации ядра (colorise/, src/ ROS, ColoriseMap/
  кубовый) и configs/config.yaml. Правило чувствительно к плотности облака;
  задокументировано предупреждение. Паритет с Python-версией снят с инвариантов.

