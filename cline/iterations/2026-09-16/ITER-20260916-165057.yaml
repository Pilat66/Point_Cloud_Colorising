  5) colorise_offline.py: load_camera() заменён на load_camera_from_calib() с теми же
     алиасами и тем же порядком выбора блока (1:1 с C++); --camera удалён; мёртвый
     import yaml убран.
  6) make_photo_plane.py: камера из --calib (следствие правки 5).
  7) CMakeLists обоих таргетов: yaml-cpp убран (единственный потребитель удалён);
     requirements.txt: pyyaml убран.

