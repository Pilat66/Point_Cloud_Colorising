     Без width/height — явная ошибка со ссылкой на образец формата.
  2) colorise/include/colorise.h: Options::camera_path удалён; CameraParams::width/
     height = 0; объявлен loadCameraFromCalib(path, cam, key_used).
  3) colorise/src/main.cpp: флаг --camera удалён (usage + парсер); [camera] печатает
     источник как «(calib: <ключ>)».
  4) ColoriseMap/src/main.cpp: CameraSpec без camera_path; группа камеры —
     «--photos <dir> --calib <json> [--name]» (пара вместо тройки); обновлены usage
