plan: |
  Запрос: для make_photo_plane.py добавить опцию — угол наклона по оси X и по оси Y.

  Согласованная семантика (выбран первый вариант ответа): оси камеры, точка привязки
  не меняется (плоскость проходит через прежний центр (cx, cy, distance) на
  оптической оси, наклоняется только нормаль), границы сетки пересчитываются под
  покрытие кадра.

  Реализация:
  1) CLI: --tilt-x / --tilt-y (градусы, default 0), порядок поворотов
     R = Ry(--tilt-y) · Rx(--tilt-x); проверка |угол| < 90°.
  2) tilt_rotation(tilt_x, tilt_y) — матрица наклона; столбцы e1/e2 лежат в
     плоскости, третий — нормаль.
  3) tilted_plane_frame(...) — точка привязки pivot = (cx, cy, distance) прежняя,
     лучи через четыре угла кадра пересекаются с наклонённой плоскостью
     (λ = (n·pivot)/(n·d)), по ним берутся центр и полуразмеры сетки в собственных
     координатах плоскости плюс площадь пятна кадра (шнуровка Штоля) и дальности
     углов; отказ, если луч не пересекает плоскость перед камерой.
  4) main(): ветвление — при нулевых углах работает прежний код (plane_rect +
     p_cam = (gx, gy, distance)) без изменений, при наклоне
     p_cam = pivot + gx·e1 + gy·e2; лимит MAX_GRID_POINTS; суффикс имени файла
     -tilt<X>x<Y>deg только при наклоне; строки [tilt]/[plane-tilt] и обновлённый
     [stats] (площадь пятна кадра на плоскости против площади сетки);
     WARN, если дальний угол дальше 20 м (дефолт --max-range).
  5) Документация: docstring (раздел «Наклон плоскости», примеры, имена файлов),
     CHANGELOG, файл итерации.

  Проверки: регресс при --tilt-x 0 --tilt-y 0 (cmp с облаком прежней версии),
  численная проверка геометрии наклонных фикстур (нормаль по SVD, прохождение через
  pivot, покрытие углов кадра, round-trip проекции углов), детерминизм, отказы,
  сквозной прогон наклонной фикстуры через colorise_offline.

