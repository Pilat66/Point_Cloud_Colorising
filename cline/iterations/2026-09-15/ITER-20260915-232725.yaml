plan: |
  Замечание пользователя: генератор строит облако в памяти, а это не нужно —
  можно считать и писать по 1000 точек сразу в файл.

  План: перевести make_photo_plane.py на потоковую генерацию: точки считаются
  порциями (--chunk, по умолчанию 1000) и сразу пишутся в PCD и в эталонный CSV;
  заголовок PCD пишется заранее (число точек nx*ny известно из геометрии), затем
  дописываются бинарные записи. Память становится O(1) вместо O(N).

  Проверки: (1) побайтовый паритет с прежней (in-memory) версией на тех же
  входных данных для двух фикстур (5 м / 100 ppm и 8 м / 50 ppm) — и облако, и
  эталон; (2) независимость результата от размера порции (--chunk 137);
  (3) демонстрация O(1) по памяти (пик RSS на 115 тыс. и 2.3 млн точек);
  (4) сквозная проверка: раскраска только эталонным кадром даёт coloured == inside.

request: |
