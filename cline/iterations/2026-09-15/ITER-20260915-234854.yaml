plan: |
  Запрос: дополнительно к точкам, которые уже генерируются, добавить 100 точек,
  обозначающих положение виртуальной фотографии — по 25 точек на каждую сторону,
  прямоугольник, параллельный создаваемому облаку, на том же расстоянии и в том
  же месте, где фото.

  Реализация: 100 точек по периметру кадра (25 на сторону, углы помечены по
  одному разу) строятся в кадре камеры на плоскости z=--distance по точным углам
  кадра (через undistortPoints, без запаса --margin, который применяется только к
  облаку) и переводятся в world тем же T_world_cam. Дописываются в конец файла;
  заголовок POINTS = nx*ny + 100. intensity/rgb = 0, как у остальных точек.

  Проверки: (1) первые nx*ny точек побайтово совпадают с прежней фикстурой
  (cmp -i 178 -n nx*ny*20); (2) заголовок POINTS = nx*ny + 100; (3) геометрия:
  новые точки, переведённые обратно в кадр камеры, имеют z ≈ distance, а угловые
  проецируются в углы изображения с малой round-trip ошибкой; (4) сквозной прогон
  только по эталонному кадру — число окрашенных = 6170 + попавшие в кадр точки
  рамки.

