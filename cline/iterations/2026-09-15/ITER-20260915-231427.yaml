plan: |
  Цель: тестовая фикстура для проверки алгоритмов раскраски — детерминированное
  облако точек в плоскости, параллельной плоскости изображения выбранного снимка,
  на заданном расстоянии. Одно облако прогоняется через разные алгоритмы
  (colorise_offline C++/Python, ColoriseMap, будущие оптимизации), результаты
  сравниваются между собой и с эталоном.

  Согласовано в Plan Mode:
  - в первой итерации делаем ТОЛЬКО генератор облака (checker — следующей);
  - скрипт ничего не раскрашивает;
  - фото задаётся позиционным аргументом, время берётся из имени файла;
  - обязательные параметры: --distance (по оптической оси, z=d) и --ppm (точек
    на м², шаг сетки 1/sqrt(ppm));
  - границы плоскости — через реальную модель камеры (разворот углов кадра
    undistortPoints / fisheye::undistortPoints) с запасом --margin, чтобы часть
    точек вышла за кадр (тест гейта края);
  - переиспользуем colorise_offline.py через импорт (load_camera, load_calib,
    load_trajectory, photo_timestamp_from_name, invert_T, save_cloud_pcd) —
    без дублирования кода;
  - эталонный sidecar (*-expected.csv: index;x;y;z;u;v;inside;R;G;B) — спутник
    фикстуры отдельным файлом, тестируемый алгоритм его не видит.

  Приёмка: генерация по двум кадрам; сходимость числа точек с площадью × ppm;
  сходимость «внутри кадра» с площадью кадра × ppm; чтение облака существующим
  инструментом ([cloud] ... pts); детерминизм (два прогона -> cmp файлов).

  Вне рамок: checker, --tilt-deg, несколько плоскостей, правки README.

