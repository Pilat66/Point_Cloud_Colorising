request: |
  я хочу перенести функционал раскраски в другой проект. Сформируй директорию
  export в которую помести файлы необходимые для того чтобы разобраться в
  алгоритме и внедрить его в другой проект.

  Уточнение (Plan Mode): экспорт строится вокруг кубового режима раскраски карты
  ColoriseMap --cube (LAS с gps_time, кубы 1 м); целевой проект — FAST-LIVO2-LAS;
  выбран вариант «самодостаточный ROS-free порт + INTEGRATION.md».

