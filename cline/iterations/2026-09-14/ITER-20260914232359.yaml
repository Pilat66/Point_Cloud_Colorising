request: |
  "на основе ColoriseMap.cpp напиши приложение раскраски, не зависящее от ROS и
  помести его в директорию ColoriseMap"

  Уточнения по ходу планирования:
  - интерфейс входных данных: офлайн-стиль как у colorise/
    (--cloud/--photos/--camera/--calib/--trajectory/--output), многокамерность —
    повторяемыми тройками;
  - IMU-компенсация: не переносить (в bag /livox/imu нет AHRS-ориентации,
    траектория прогона уже 200 Гц) — только none|odom, bag только для сверки
    времени, IMU-режим отдельной задачей при необходимости.

plan: |
  ROS-free C++ приложение ColoriseMap/ (цель cmake colorise_map), переносящее
  специфику узла ColoriseMap.cpp без ROS: карта статична в world-кадре, поза
  лидара интерполируется на время кадра из CSV, карта отсеивается по радиусу
  вокруг камеры, цвет накапливается по кадрам с порогом min_color_frames,
  z-буфер окклюзии, сохранение в конце прогона. Ядро не дублируется: цель
  компилирует уже валидированные исходники ../colorise (io/trajectory/project +
  заголовки + vendored nlohmann/json), сам colorise/ не меняется. Многокамерность:
  каждый --photos открывает камеру, следующие --camera/--calib относятся к ней.
  Параллелизм по кадрам с фиксацией строго в порядке кадров (детерминированный
  лог и суммы). Валидация: сборка, smoke на данных репозитория, побайтовый
  паритет выходного PCD с colorise/build/colorise_offline при одной камере и тех
  же параметрах, сверка строк лога по кадрам, проверка .las-выхода и негативных
  случаев CLI.

description: >-
